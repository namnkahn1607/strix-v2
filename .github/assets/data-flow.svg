<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1336.0 1122.0" width="1336.0" height="1122.0" font-family="'JetBrains Mono','DejaVu Sans Mono',Menlo,Consolas,monospace" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Strix - data flow</title><desc id="d">Read path: the client request reaches the gateway, which checks the engine's cache. A hit returns the cached response; a miss is forwarded to the upstream LLM. Write path: a successful payload is returned to the client and written back to the engine; a failure is returned to the client as an error.</desc>
