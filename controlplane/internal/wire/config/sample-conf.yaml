supervisor:
  drain_timeout: 6s

ipc:
  socket_address: "unix:///tmp/strix.sock"

gateway:
  http:
    port: 8080
    proxy_endpoint: "/v1/cache/strix"
    max_reader_size: 1048576    # REQUIRED
  rpc_client:
    check_cache_timeout: 50ms
    set_cache_timeout: 50ms
  writeback:
    pool_size: 8                # REQUIRED
    job_queue_capacity: 1000    # REQUIRED
  cache_policy:
    max_prompt_len: 1536        # REQUIRED
  shutdown_timeout: 5s

engine:
  shutdown_timeout: 3s
  rpc_server:
    worker_pool_size: 3
  ivf:
    num_clusters: 1024
    max_cluster_size: 1024
    staging_buffer_capacity: 4096
  calibration:
    sample_size: 65536
    recalibrate_trigger_count: 16384
    mini_batch_size: 1024
    max_lloyd_iteration: 16
    min_convergence: 0.0001
    grace_period_seconds: 1
  search:
    similarity_threshold: 0.85
    top_k: 4
  storage:
    max_slots: 524288
    payload_buffer_bytes: 4294967296
    buffer_pool_capacity: 64

upstreams:
  - name: primary
    type: anthropic
    endpoint: "https://api.anthropic.com/v1/messages"
    auth_kind: api_key
    auth_key_env_var: STRIX_ANTHROPIC_API_KEY
    max_idle_conns_per_host: 8
    idle_conn_timeout: 60s
    response_header_timeout: 15s
